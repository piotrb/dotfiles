# Don't print a new line at the start of the prompt
add_newline = false

[aws]
#symbol = " "
disabled = true

[directory]
truncate_to_repo=false

[line_break]
disabled = true

#[ruby]
#format = "[$symbol$version]($style) "
#symbol = " "

#[battery]
#full_symbol = ""
#charging_symbol = ""
#discharging_symbol = ""

#[docker_context]
#symbol = " "

[git_branch]
# better more compact branch symbol
symbol = " "
#format = "[$symbol$branch]($style) "

#[golang]
#symbol = " "

#[memory_usage]
#symbol = " "

[nodejs]
symbol = "󰎙 "
#format = "[$symbol$version]($style) "

[package]
symbol = " "
#format = "[$symbol$version]($style) "

[gcloud]
disabled = true

[status]
disabled = false
#format = "[$symbol$status]($style) "
symbol = " "

[cmd_duration]
#min_time = 2000
#format = "took [$duration]($style) "
#style = "yellow bold"
#show_milliseconds = false
disabled = true
#show_notifications = false
#min_time_to_notify = 45000

[bun]
# default bun symbol seems to somehow mess with the prompt
symbol = " "

[python]
pyenv_prefix = "pyenv "
symbol = " "

[[claude_context.display]]
threshold = 0.0
style = "bold green"
hidden = false

[[claude_context.display]]
threshold = 30.0
style = "bold green"
hidden = false

[[claude_context.display]]
threshold = 60.0
style = "bold yellow"
hidden = false

[[claude_context.display]]
threshold = 80.0
style = "bold red"
hidden = false
